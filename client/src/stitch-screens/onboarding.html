<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NutriSense - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#bbcbbb",
                        "surface-bright": "#f3fcf1",
                        "on-surface": "#161d17",
                        "tertiary": "#98472a",
                        "on-surface-variant": "#3d4a3e",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "secondary": "#006397",
                        "on-primary-container": "#005027",
                        "primary-fixed-dim": "#4ae183",
                        "tertiary-fixed": "#ffdbd0",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#390c00",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#ebf3e8",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#92ccff",
                        "on-primary-fixed": "#00210c",
                        "primary": "#006d37",
                        "on-secondary-container": "#00476e",
                        "outline": "#6c7b6d",
                        "inverse-surface": "#2b322b",
                        "primary-container": "#2ecc71",
                        "surface-container": "#e8f0e5",
                        "background": "#f3fcf1",
                        "surface": "#f3fcf1",
                        "on-error": "#ffffff",
                        "tertiary-container": "#ff9875",
                        "secondary-container": "#5cb8fd",
                        "surface-container-low": "#eef6eb",
                        "tertiary-fixed-dim": "#ffb59d",
                        "on-background": "#161d17",
                        "inverse-primary": "#4ae183",
                        "on-secondary-fixed-variant": "#004b73",
                        "surface-tint": "#006d37",
                        "on-primary-fixed-variant": "#005228",
                        "on-secondary-fixed": "#001d31",
                        "surface-container-highest": "#dce5da",
                        "on-tertiary-fixed-variant": "#793015",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#6bfe9c",
                        "surface-variant": "#dce5da",
                        "surface-dim": "#d4dcd2",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e2ebe0",
                        "on-tertiary-container": "#772e14",
                        "secondary-fixed": "#cce5ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "container-max-width": "1280px",
                        "gutter": "24px",
                        "stack-sm": "8px",
                        "margin": "32px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "label-lg": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased min-h-screen flex flex-col items-center pt-16 pb-24 px-6 md:px-margin">
<!-- Suppressed TopNavBar/SideNavBar as this is a linear onboarding flow -->
<div class="w-full max-w-2xl flex flex-col gap-stack-lg">
<!-- Header & Progress -->
<header class="text-center flex flex-col gap-stack-md">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">NutriSense</h1>
<div class="w-full max-w-md mx-auto">
<div class="flex justify-between text-label-md font-label-md text-on-surface-variant mb-2">
<span>Step 1 of 3</span>
<span>33%</span>
</div>
<!-- Progress Bar -->
<div class="h-3 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 33%;"></div>
</div>
</div>
</header>
<!-- Step 1 Content -->
<main class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0_4px_20px_rgba(44,62,80,0.04)] p-8 md:p-12 flex flex-col gap-stack-lg">
<div class="text-center flex flex-col gap-stack-sm">
<h2 class="font-headline-md text-headline-md text-on-surface">What's your main health goal?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select the primary reason you're joining NutriSense today.</p>
</div>
<!-- Goal Cards Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Card 1: Active State -->
<button class="flex flex-col items-center justify-center p-6 rounded-xl border-2 border-primary bg-primary-container/10 transition-all duration-200 text-center gap-3">
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">monitor_weight</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Lose Weight</span>
</button>
<!-- Card 2: Inactive -->
<button class="flex flex-col items-center justify-center p-6 rounded-xl border border-outline-variant/50 bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-200 text-center gap-3">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl">fitness_center</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Gain Muscle</span>
</button>
<!-- Card 3: Inactive -->
<button class="flex flex-col items-center justify-center p-6 rounded-xl border border-outline-variant/50 bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-200 text-center gap-3">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl">local_dining</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Eat Healthier</span>
</button>
<!-- Card 4: Inactive -->
<button class="flex flex-col items-center justify-center p-6 rounded-xl border border-outline-variant/50 bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-200 text-center gap-3">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl">health_and_safety</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Manage a Condition</span>
</button>
<!-- Card 5: Inactive (Spans 2 cols on mobile if needed, or just regular) -->
<button class="flex flex-col items-center justify-center p-6 rounded-xl border border-outline-variant/50 bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-200 text-center gap-3 md:col-span-2">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-3xl">balance</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">Maintain Weight</span>
</button>
</div>
<!-- Actions -->
<div class="mt-4 flex justify-between items-center pt-6 border-t border-outline-variant/30">
<button class="px-6 py-3 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-low transition-colors">
                    Back
                </button>
<button class="px-8 py-3 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg hover:bg-surface-tint transition-colors flex items-center gap-2">
                    Continue
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</main>
</div>
</body></html>
